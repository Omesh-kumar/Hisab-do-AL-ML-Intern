<svg width="680" height="620" viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg">
<rect width="680" height="620" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#333" stroke-width="1.5"/></marker></defs>
<g font-family="Arial" font-size="14">
<rect x="250" y="20" width="180" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="340" y="46" text-anchor="middle">User</text>
<line x1="340" y1="64" x2="340" y2="100" stroke="#333" marker-end="url(#arrow)"/>
<rect x="220" y="100" width="240" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<text x="340" y="124" text-anchor="middle">Website / Web App / Mobile App</text>
<text x="340" y="142" text-anchor="middle" font-size="12">Captures transaction input</text>
<line x1="340" y1="156" x2="340" y2="192" stroke="#333" marker-end="url(#arrow)"/>
<rect x="220" y="192" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="340" y="216" text-anchor="middle">Backend / API</text>
<text x="340" y="234" text-anchor="middle" font-size="12">Forwards request to AI service</text>
<line x1="340" y1="248" x2="340" y2="284" stroke="#333" marker-end="url(#arrow)"/>
<rect x="220" y="284" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="340" y="308" text-anchor="middle">AI Service (FastAPI)</text>
<text x="340" y="326" text-anchor="middle" font-size="12">Validates and processes request</text>
<line x1="340" y1="340" x2="340" y2="376" stroke="#333" marker-end="url(#arrow)"/>
<rect x="220" y="376" width="240" height="56" rx="8" fill="#FAECE7" stroke="#993C1D"/>
<text x="340" y="400" text-anchor="middle">AI Model</text>
<text x="340" y="418" text-anchor="middle" font-size="12">TF-IDF + Logistic Regression</text>
<line x1="340" y1="432" x2="340" y2="468" stroke="#333" marker-end="url(#arrow)"/>
<rect x="220" y="468" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
<text x="340" y="492" text-anchor="middle">Response</text>
