<path d="M220 496 L120 496 L120 140 L218 140" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="90" y="320" text-anchor="middle" font-size="12" transform="rotate(-90 90 320)">Result returned to app</text>
</g>
</svg>
